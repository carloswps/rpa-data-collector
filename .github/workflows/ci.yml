name: CI

on:
  push: 
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  
jobs: 
  build-and-test:
    runs-on: ${{ matrix.os }}
    
    strategy: 
      matrix: 
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: [10.0.x]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
          
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
        
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
  
  build-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build image RpaWorker
        run: docker build -f RpaWorker/Dockerfile .
      
      - name: Build imagem WebApi
        run: docker build -f WebApi/Dockerfile . 